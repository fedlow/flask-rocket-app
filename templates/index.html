<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический сайт</title>
    <!-- Подключаем CSS через url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Заголовок с тегом h -->
        <h1>Добро пожаловать на борт!</h1>
        
        <!-- Текст-описание с тегом p -->
        <p>Это учебное Flask-приложение, которое отправляет вас в космическое путешествие. 
        Здесь вы найдёте всё необходимое для старта в мир веб-разработки.</p>
        
        <!-- Изображение -->
        <img src="{{ url_for('static', filename='rocket.png') }}" alt="Космическая ракета" class="rocket-img">
    </div>
</body>
</html>
